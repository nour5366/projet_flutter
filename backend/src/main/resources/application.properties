# Port d'écoute du serveur Spring Boot (8081 selon le sujet Flutter)
server.port=8081

# Connexion à la base de données MySQL de XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/scol_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuration Spring Data REST - base-path changé pour éviter conflit avec /api des controllers REST
# Les controllers manuels utilisent /api, Spring Data REST utilise /data-rest
spring.data.rest.base-path=/data-rest
spring.data.rest.default-page-size=50

# Desactiver la serialisation des lazy-loaded collections par defaut
spring.jpa.open-in-view=false
